[defaults]
roles_path=roles/internal:roles/external
collections_path=collections/
remote_user = root
# The default behaviour is for handlers not to get called if a playbook fails
# for any reason. Make handlers get called
force_handlers = True


### Vault password files
# We now use 1Password CLI to manage vault passwords securely
# Make sure you have:
# 1. Installed 1Password CLI: https://developer.1password.com/docs/cli/get-started/
# 2. Authenticated with: eval $(op signin)
# 3. Stored vault passwords in 1Password "Infrastructure" vault with names:
#    - ansible-vault-default
#    - ansible-vault-rtk
#    - ansible-vault-ec2
#    - ansible-vault-all
#
### Vault IDs:
#
# rtk - right-to-know secrets
#       Secrets used only by RightToKnow
# ec2 - secrets used by every service running in EC2
#       eg, AWS keys, the RDS hostnames
# all - secrets used across every OA service
#       Currently this includes default values for certbot and backups
# default - default ID used for things that haven't been split out yet
#
# Each vault ID uses the op-vault-pass.sh script to fetch passwords from 1Password
# Customize this list based on which services you administer

vault_identity_list = default@bin/op-vault-pass.sh default,rtk@bin/op-vault-pass.sh rtk,ec2@bin/op-vault-pass.sh ec2,all@bin/op-vault-pass.sh all

inventory = inventory

[ssh_connection]
pipelining = True