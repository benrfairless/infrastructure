---
dependencies:
  - role: zzet.rbenv
    rbenv:
      env: user
      version: v1.1.2
      default_ruby: "{{ ruby_version_staging if 'righttoknow_staging' in group_names else ruby_version_production }}"
      rubies:
        - version: "{{ ruby_version_staging }}"
        - version: "{{ ruby_version_production }}"
    rbenv_users:
      - deploy

  - role: oaf.restic
    restic_profiles:
      - name: righttoknow_data
        schedule: "0 3 * * *"
        source: /data
        repository: "s3:s3.amazonaws.com/oaf-backups/righttoknow/{{ log_name }}/restic"
        password: "{{ restic_password }}"
        aws_access_key_id: "{{ backup_target_user }}"
        aws_secret_access_key: "{{ backup_target_pass }}"
        exclude:
          - "**/bundle"
          - "**/cache"
        cache_dir: /data/restic-cache
    when: ansible_distribution_release in ['bionic', 'jammy'] and 'righttoknow_production' in group_names
    tags:
      - backup
    
  - role: cloudflare_realip
    cloudflare_webserver: nginx
    tags:
    - cloudflare_realip

  - role: nickhammond.logrotate
    logrotate_scripts:
      # This is the log rotation scheme required by Alaveteli
      # See http://alaveteli.org/docs/installing/email/#logging
      - name: mail
        path: /var/log/mail/mail.log
        options:
          - rotate 30
          - daily
          - dateext
          - missingok
          - notifempty
          - compress
          - delaycompress
          - sharedscripts
          - postrotate systemctl restart rsyslog >/dev/null 2>&1 || true
          - endscript
      - name: production
        path: "/srv/www/production/shared/log/*.log"
        options:
          - daily
          - rotate 28
          - compress
          - missingok
          - notifempty
          - copytruncate
      - name: staging
        path: "/srv/www/staging/shared/log/*.log"
        options:
          - daily
          - rotate 28
          - compress
          - missingok
          - notifempty
          - copytruncate
